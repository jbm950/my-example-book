[package]
name = "rs-nucleo-f446re-button-interrupt-pac"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
critical-section = "1.2.0"
panic-halt = "1.0.0"
stm32f4 = { version = "0.16.0", features = ["cortex-m-rt", "stm32f446"] }
