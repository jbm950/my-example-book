[package]
name = "rs-nucleo-f446re-blinky-timer-interrupt-pac"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
critical-section = "1.2.0"
panic-rtt-target = "0.2.0"
rtt-target = "0.6.2"
stm32f4 = { version = "0.16.0", features = ["cortex-m-rt", "stm32f446"] }
